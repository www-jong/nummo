services:
  nummo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nummo
    restart: unless-stopped
    expose:
      - "3000"
      - "9464"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
